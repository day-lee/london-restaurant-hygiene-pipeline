my_dbt_project:
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DW_HOST') }}"
      user: "{{ env_var('DW_USER') }}"
      password: "{{ env_var('DW_PASSWORD') }}"
      port: "{{ env_var('DW_PORT') | int }}"
      dbname: "postgres"
      schema: public
      threads: 1 
      prepared_statements: false
      connect_timeout: 10
      retry_all_failed_queries: true
  target: dev