name: Batch Airflow Run 

on:
    schedule: 
        - cron: '0 0 * * *' #every day at midnight UTC
    workflow_dispatch: # manual trigger test 
jobs: 
    run_pipeline:
        runs-on: ubuntu-latest 
        steps:
            - name: Checkout repository 
              uses: actions/checkout@v3 
            
            - name: Set up Fly.io CLI 
              uses: superfly/flyctl-actions/setup-flyctl@master 
              with: 
                version: '0.2.10'

            - name: Fly.io Airflow Start 
              run: | 
                echo "Starting Airflow..."
                flyctl machine start 8747495f6109e8 -a london-restaurant-hygiene-pipeline
              env: 
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

            - name: 🎯 Airflow DAG 강제 트리거 (첫 가동 수동 명령)
              run: | 
                echo "DAG를 강제로 즉시 실행합니다..."
                # [수정 완료] machine exec 명령어를 사용하여 내부에서 Airflow CLI를 바로 쏩니다.
                flyctl machine exec 8747495f6109e8 "airflow dags trigger london_restaurant_hygiene_pipeline" -a london-restaurant-hygiene-pipeline
              env: 
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
               
                      
            - name: Waiting for Airflow to be fully up and running the Dag
              run: |
                echo "waiting for 5 minutes to ensure Airflow is fully up and run the DAG"
                sleep 240 

            - name: Fly.io Airflow Stop 
              if: always() # Ensure this step runs even if previous steps fail
              run: | 
                echo "Stopping Airflow...to prevent billing"
                flyctl machine stop 8747495f6109e8 -a london-restaurant-hygiene-pipeline
              env: 
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}